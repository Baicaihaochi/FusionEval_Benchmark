# Llama 3.2 text architecture; standard tied embeddings.
schema_version: 1
name: llama3.2-3b
architecture:
  model_type: llama
  vocab_size: 128256
  hidden_size: 3072
  intermediate_size: 8192
  num_hidden_layers: 28
  num_attention_heads: 24
  num_key_value_heads: 8
  head_dim: 128
  tie_word_embeddings: true
decoder:
  layer_prefix: model.layers
  attention_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  mlp_modules:
  - gate_proj
  - up_proj
  - down_proj
